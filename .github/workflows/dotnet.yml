name: .NET
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ImportNet.sln
      - run: dotnet build ImportNet.sln --no-restore --configuration Release
      - run: dotnet test ImportNet.sln --no-build --configuration Release
