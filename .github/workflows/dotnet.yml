name: .NET
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ImportNet/frontend/package-lock.json
      - name: Preparar frontend para la API
        shell: pwsh
        run: ./ImportNet/scripts/Preparar-Frontend.ps1
      - run: dotnet restore ImportNet.sln
      - run: dotnet build ImportNet.sln --no-restore --configuration Release
      - run: dotnet test ImportNet.sln --no-build --configuration Release
      - run: dotnet publish ImportNet/ImportNet.API --no-build --configuration Release --output artifacts/api
  dashboard-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ImportNet
          POSTGRES_USER: postgres
          # Servicio efímero del runner; no se utilizan credenciales de desarrollo ni producción.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ImportNet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IMPORTNET_POSTGRES_TESTS: '1'
      ConnectionStrings__ImportNet: 'Host=localhost;Port=5432;Database=ImportNet;Username=postgres'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: >-
          dotnet test ImportNet.sln --configuration Release
          --filter 'FullyQualifiedName~DashboardPostgreSqlTests|FullyQualifiedName~PosPostgreSqlTests'
