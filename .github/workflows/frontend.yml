name: Frontend

on:
  pull_request:
  push:
    branches:
      - main
      - frontend-base
      - feat/ventas-dia12

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ImportNet/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ImportNet/frontend/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build